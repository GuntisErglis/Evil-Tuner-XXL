name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ragel scons autoconf automake libtool pkg-config autopoint gettext cmake llvm ffmpeg
          pip install ziglang pillow numpy scipy

      - name: Helpers (static armv7: ffmpeg, et_roc, shairport-sync)
        uses: actions/cache@v4
        id: helpers
        with:
          path: build/helpers
          key: helpers-${{ hashFiles('helpers/**') }}

      - name: Build the helpers
        if: steps.helpers.outputs.cache-hit != 'true'
        run: helpers/build_helpers.sh

      - name: Tests (x86, ASan + UBSan)
        run: test/run_tests.sh

      - name: Build (armv7, glibc 2.31)
        run: |
          ./build.sh > build.log 2>&1 || { tail -40 build.log; exit 1; }
          tail -3 build.log
          git diff --exit-code params.json layout.conf

      # A release is made by a v* tag, or by a push to main whose top CHANGELOG version ("## X.Y.Z") has no tag yet.
      - name: Version
        id: ver
        run: |
          REL=0; V="0.0.0-dev"
          case "$GITHUB_REF" in
            refs/tags/v*) V="${GITHUB_REF_NAME#v}"; REL=1 ;;
            refs/heads/main)
              C=$(sed -n 's/^## \([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\) *$/\1/p' CHANGELOG.md | head -1)
              if [ -n "$C" ] && ! git ls-remote --exit-code --tags origin "refs/tags/v$C" > /dev/null; then V="$C"; REL=1; fi ;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"; echo "release=$REL" >> "$GITHUB_OUTPUT"; echo "version $V, release $REL"

      - name: Package
        run: |
          python3 third_party/mpc-vst-plugins/tools/release.py \
            --so build/arm/evil_tuner_xxl.so \
            --skin "build/skin/ANDREALPHEUS - VST - Evil Tuner XXL" \
            --entry build/pluginlist-entry.xml \
            --version "${{ steps.ver.outputs.version }}" \
            --extra build/helpers:bin \
            --user-data user_data \
            --about "Evil Tuner XXL by ANDREALPHEUS: internet radio, phone (Roc) and AirPlay into an MPC track, through grains, filter, character, saturator, Erica-style delay, reverb, trance gate and a looper" \
            --requires "a network (Wi-Fi or a phone hotspot)" \
            --id evil-tuner-xxl --repo sunskiefer/evil-tuner-xxl --license GPL-3.0-or-later \
            -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: Evil-Tuner-XXL-mpc-armv7
          path: dist/*.zip

      - name: Release
        if: steps.ver.outputs.release == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Evil Tuner XXL ${{ steps.ver.outputs.version }}
          body_path: CHANGELOG.md
          files: dist/*.zip
